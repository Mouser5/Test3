operations:
  - code: 0
    name: PASS
    description: Pass turn (only allowed when hand is empty)
    format: "0"
    example: "0"
    validation:
      - "Hand must be empty"

  - code: 1
    name: BUILD
    description: Build a card on the board
    format: "1\n{card_id}\n{x};{y}\n{is_rotated}"
    parameters:
      - name: card_id
        type: integer
        description: ID of the card from player's hand
      - name: x
        type: integer
        description: X coordinate on the board
      - name: y
        type: integer
        description: Y coordinate on the board
      - name: is_rotated
        type: integer
        description: "0 = normal, 1 = rotated 180 degrees"
    example: |
      1
      96
      -2;0
      0
    validation:
      - "Card must be in player's hand"
      - "Position must be available on board"

  - code: 2
    name: REPAIR
    description: Repair a broken tool
    variants:
      - name: Normal Repair
        description: Use 1 card to repair a tool
        format: "2\n{equipment_id}\n{card_id}"
        parameters:
          - name: equipment_id
            type: integer
            description: ID of equipment to repair (1=LAMP, 2=CART, 3=PICKAXE)
          - name: card_id
            type: integer
            description: ID of repair card from player's hand
        example: |
          2
          1
          95
        validation:
          - "Equipment must be broken"
          - "Repair card must be in player's hand"

      - name: Emergency Repair
        description: Use 2 cards to repair a tool
        format: "2\n{equipment_id}\n{card_id1};{card_id2}"
        parameters:
          - name: equipment_id
            type: integer
            description: ID of equipment to repair (1=LAMP, 2=CART, 3=PICKAXE)
          - name: card_id1
            type: integer
            description: First repair card ID
          - name: card_id2
            type: integer
            description: Second repair card ID
        example: |
          2
          2
          95;94
        validation:
          - "Equipment must be broken"
          - "Both cards must be in player's hand"

  - code: 3
    name: DISCARD
    description: Discard cards from hand (1-2 cards)
    format: "3\n{card_ids}"
    parameters:
      - name: card_ids
        type: string
        description: "Single card ID or multiple IDs separated by ;"
    examples:
      - "3\n96"
      - "3\n96;95"
    validation:
      - "Maximum 2 cards can be discarded"
      - "All cards must be in player's hand"

equipment_ids:
  1: LAMP
  2: CART
  3: PICKAXE
