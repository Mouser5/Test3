state_format:
  description: Format of game state sent from system to bot
  board_entries:
    format: "{x};{y} {card_id} {is_rotated}"
    example: "-2;-5 8001 0"
    fields:
      - name: x
        type: integer
        description: X coordinate
      - name: y
        type: integer
        description: Y coordinate
      - name: card_id
        type: integer
        description: Unique card ID on board
      - name: is_rotated
        type: integer
        description: "0 = not rotated, 1 = rotated 180 degrees"
  broken_equipments:
    format: "p{player_id} {broken_ids}"
    example: "p0 1;2"
    fields:
      - name: player_id
        type: integer
        description: Player ID (0 or 1)
      - name: broken_ids
        type: string
        description: "Semicolon-separated equipment IDs, or 0 if none"
  hand:
    format: |
      {hand_size}
      {card_id1};{card_id2};...
    example: |
      4
      96;95;94;93
    fields:
      - name: hand_size
        type: integer
        description: Number of cards in hand
      - name: card_ids
        type: string
        description: Semicolon-separated card IDs

game_flow:
  description: Complete game communication flow
  steps:
    - step: 1
      actor: System
      action: Send game state to bot
      format: "State format (see state_format)"
    - step: 2
      actor: Bot
      action: Parse game state
      description: "Extract board, hand, and broken equipment info"
    - step: 3
      actor: Bot
      action: Decide action
      description: "Choose operation based on game state"
    - step: 4
      actor: Bot
      action: Send action to system
      format: "Operation code + parameters (see operations)"
    - step: 5
      actor: System
      action: Validate action
      description: "Check if action is legal"
    - step: 6
      actor: System
      action: Execute action or return error
      description: "If valid, execute and send new state; if invalid, return error"

validation_rules:
  pass:
    - "Hand must be empty"
  build:
    - "Card must be in player's hand"
    - "Position must be available on board"
    - "Coordinates must be valid"
  repair:
    - "Equipment must be broken (have damage)"
    - "All cards must be in player's hand"
    - "Emergency repair requires exactly 2 cards"
  discard:
    - "Maximum 2 cards can be discarded"
    - "All cards must be in player's hand"
