services:
  redis:
    image: redis:8.6.2
    container_name: gnomes-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17.9
    container_name: gnomes-postgres
    environment:
      POSTGRES_USER: gnomes
      POSTGRES_PASSWORD: gnomes_secret
      POSTGRES_DB: gnomes_game
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5111:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnomes -d gnomes_game"]
      interval: 5s
      timeout: 5s
      retries: 5

  game-api:
    build: .
    container_name: gnomes-api
    working_dir: /app/src
    command: sh -c "python web/init_db.py && python -m uvicorn web.api:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql://gnomes:gnomes_secret@postgres:5432/gnomes_game
      - LOG_DIR=/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  game-web:
    build: .
    container_name: gnomes-game
    working_dir: /app/src
    command: sh -c "python web/init_db.py && streamlit run web/app.py --server.port=8501 --server.address=0.0.0.0"
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql://gnomes:gnomes_secret@postgres:5432/gnomes_game
      - REDIS_URL=redis://redis:6379/0
      - LOG_DIR=/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      game-api:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  logs:
